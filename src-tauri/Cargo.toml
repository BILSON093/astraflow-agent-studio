[package]
name = "astraflow-agent-studio"
version = "0.1.0"
description = "AstraFlow Agent Studio desktop shell"
authors = ["AstraFlow"]
edition = "2021"

[lib]
name = "astraflow_agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
